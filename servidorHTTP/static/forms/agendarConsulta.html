<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Consulta</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/agendarConsulta.style.css">
</head>
<body>
    <div id="container">
        <h3>Agende a sua consulta</h3>
        
        <form method="POST" action="/agendarConsulta">
            <div>
                <label for="nomePaciente">Nome do Paciente:</label>
                <input id="nomePaciente" name="nomePaciente" placeholder="Digite o seu nome aqui" type="text" required>
            </div>
            
            <div>
                <label for="nomeMedico">Nome do Médico:</label>
                <select id="nomeMedico" name="nomeMedico" required>
                    <option value="" disabled selected>Selecione o médico aqui</option>
                    <option value="Dr. Carlos Souza">Dr. Carlos Souza</option>
                    <option value="Dr. Roberto Silva">Dr. Roberto Silva</option>
                    <option value="Dra. Ana Paula">Dra. Ana Paula</option>
                    <option value="Dra. Mariana Costa">Dra. Mariana Costa</option>
                    <option value="Dr. Lucas Oliveira">Dr. Lucas Oliveira</option>
                </select>
            </div>
            
            <div>
                <label for="especialidade">Especialidade:</label>
                <select id="especialidade" name="especialidade" required>
                    <option value="" disabled selected>Selecione a especialidade aqui</option>
                    <option value="Clínica Geral">Clínica Geral</option>
                    <option value="Cardiologia">Cardiologia</option>
                    <option value="Pediatria">Pediatria</option>
                    <option value="Dermatologia">Dermatologia</option>
                    <option value="Ortopedia">Ortopedia</option>
                </select>
            </div>
            
            <div>
                <label for="dataConsulta">Data da Consulta:</label>
                <input id="dataConsulta" name="dataConsulta" type="text" placeholder="DD/MM/AAAA" maxlength="10" required>
            </div>
            
            <div>
                <label for="horarioConsulta">Horário da Consulta:</label>
                <input id="horarioConsulta" name="horarioConsulta" type="text" placeholder="HH:MM" maxlength="5" required>
            </div>

            <button type="submit"><span>Concluir</span></button>
        </form>
        
        <a href="/index.html" class="back-link">
            <span>Voltar ao Início</span>
        </a>
    </div>

    <script>
        document.getElementById('dataConsulta').addEventListener('input', function (e) {
            var x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : x[1] + '/' + x[2] + (x[3] ? '/' + x[3] : '');
        });

        document.getElementById('horarioConsulta').addEventListener('input', function (e) {
            var x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})/);
            e.target.value = !x[2] ? x[1] : x[1] + ':' + x[2];
        });
    </script>
</body>
</html>
